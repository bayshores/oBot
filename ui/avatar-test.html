<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar engine test</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0e0e0e; color: #dbdbdb; }
  header { padding: 16px 20px; border-bottom: 1px solid #262626; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .note { color: #8a8a8a; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 1100px) { .themes { grid-template-columns: 1fr; } }
  .panel { padding: 16px 20px 28px; }
  .panel.dark { background: #161616; color: #dbdbdb; }
  .panel.light { background: #fcfcfc; color: #1c1c1c; }
  .panel.light .muted { color: #6b6b6b; }
  .muted { color: #8a8a8a; }
  h2 { font-size: 13px; font-weight: 600; margin: 22px 0 8px; letter-spacing: .02em; }
  h2:first-child { margin-top: 0; }
  .grid { display: grid; gap: 6px 4px; align-items: center; }
  .shapes { grid-template-columns: 70px repeat(5, 44px); }
  .cell { display: flex; align-items: center; justify-content: center; height: 44px; }
  .label { font-size: 11px; }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .live { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; }
  .live .label { text-align: center; min-height: 15px; }
  .sidebar { width: 300px; border-radius: 12px; padding: 8px; }
  .panel.dark .sidebar { background: #1c1c1c; }
  .panel.light .sidebar { background: #f5f5f5; }
  .bot { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; }
  .panel.dark .bot.sel { background: #262626; }
  .panel.light .bot.sel { background: #e9e9e9; }
  .bot .name { font-size: 15px; }
  .bot .sub { font-size: 13px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  button, select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid #444; background: transparent; color: inherit; cursor: pointer; }
  .panel.light button, .panel.light select { border-color: #ccc; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .big { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
</style>
<script src="/avatar.js"></script>
</head>
<body>
<header>
  <h1>openbot avatar engine</h1>
  <span class="note">Left: dark theme. Right: light theme. Live avatars run at 30 fps and stop when off screen.</span>
  <span class="note" id="motion"></span>
</header>
<div class="themes">
  <section class="panel dark" data-theme="dark"></section>
  <section class="panel light" data-theme="light"></section>
</div>
<script>
(function () {
  const A = window.OBAvatar;
  document.getElementById('motion').textContent = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    ? 'Reduced motion is on: live avatars are drawn once, settled.' : '';

  const STILL_COLORS = ['magenta', 'orange', 'blue', 'red', 'black'];
  const LIVE_STATES = ['idle', 'working', 'thinking', 'streaming', 'waiting', 'done', 'failed', 'sleeping', 'searching', 'writing', 'orbit', 'progress'];
  const CYCLE = ['idle', 'working', 'thinking', 'waiting', 'done', 'failed', 'sleeping'];
  const controllers = [];

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v);
    }
    for (const k of kids) e.append(k);
    return e;
  }

  function build(panel) {
    const theme = panel.dataset.theme;

    // 1. Sidebar mock-up.
    panel.append(el('h2', {}, 'Sidebar (36 px, live; hover a row to make its bot look at the pointer)'));
    const side = el('div', { class: 'sidebar' });
    side.append(el('div', { style: 'display:flex;justify-content:center;padding:10px 0 14px', html: A.group([{ initial: 'S' }, { shape: 'heart', color: 'magenta' }, { shape: 'heart', color: 'orange' }, { shape: 'sparkle', color: 'blue' }], 64, { theme }) }));
    const bots = [
      { name: 'General Bot', sub: 'Yep, Canvas shows the Integrity...', shape: 'blob', color: 'magenta', badge: 'main', sel: true },
      { name: 'Decision Reviewer', sub: "Sure! I'm here for when you're...", shape: 'pebble', color: 'orange' },
      { name: 'Follow-through Coach', sub: 'I saved the role to my memory', shape: 'sparkle', color: 'blue' },
      { name: 'Digital Librarian', sub: "Hi Sean! I'm ready to start", shape: 'blob', color: 'red' },
    ];
    for (const b of bots) {
      const holder = el('span');
      const row = el('div', { class: 'bot' + (b.sel ? ' sel' : '') }, holder, el('div', {}, el('div', { class: 'name' }, b.name), el('div', { class: 'sub' }, b.sub)));
      side.append(row);
      const c = A.mount(holder, { shape: b.shape, color: b.color, size: 36, theme, badge: b.badge, interactive: true });
      controllers.push(c);
      row.addEventListener('pointermove', (ev) => {
        const r = holder.getBoundingClientRect(), w = r.width * 0.5;
        c.lookAt(Math.max(-1, Math.min(1, (ev.clientX - (r.left + r.width / 2)) / w)), Math.max(-1, Math.min(1, -(ev.clientY - (r.top + r.height / 2)) / w)));
      });
      row.addEventListener('pointerleave', () => c.lookAt(null));
    }
    panel.append(side);

    // 2. Live states.
    panel.append(el('h2', {}, 'Live states (36 px)'));
    const live = el('div', { class: 'row' });
    LIVE_STATES.forEach((s, i) => {
      const holder = el('span');
      live.append(el('div', { class: 'live' }, holder, el('div', { class: 'label muted' }, s)));
      controllers.push(A.mount(holder, { shape: A.PICKER_SHAPES[i % A.PICKER_SHAPES.length], color: STILL_COLORS[i % 4], size: 36, theme, state: s, restWhenIdle: false }));
    });
    panel.append(live);

    panel.append(el('h2', {}, 'Cycling through the states (64 px). Click to poke.'));
    const cyc = el('div', { class: 'row' });
    const cycLabels = [];
    ['blob', 'cloud', 'star', 'hex'].forEach((shape, i) => {
      const holder = el('span'), label = el('div', { class: 'label muted' }, 'idle');
      cycLabels.push(label);
      cyc.append(el('div', { class: 'live', style: 'width:96px' }, holder, label));
      const c = A.mount(holder, { shape, color: ['violet', 'green', 'yellow', 'cyan'][i], size: 64, theme, state: 'idle', interactive: true });
      controllers.push(c);
      c._cycleOffset = i;
      c._label = label;
      c._cycle = true;
    });
    panel.append(cyc);

    // 3. Interactive playground.
    panel.append(el('h2', {}, 'Playground (96 px): hover to look, click to poke'));
    const pg = el('span');
    const shapeSel = el('select');
    A.SHAPES.forEach((s) => shapeSel.append(el('option', { value: s }, s)));
    const colorSel = el('select');
    A.COLORS.forEach((c) => colorSel.append(el('option', { value: c.id }, c.id)));
    colorSel.value = 'violet';
    const stateSel = el('select');
    A.STATES.forEach((s) => stateSel.append(el('option', { value: s }, s)));
    const pc = A.mount(pg, { shape: 'blob', color: 'violet', size: 96, theme, interactive: true, followPointer: true, restWhenIdle: false });
    controllers.push(pc);
    shapeSel.onchange = () => pc.set({ shape: shapeSel.value });
    colorSel.onchange = () => pc.set({ color: colorSel.value });
    stateSel.onchange = () => pc.set({ state: stateSel.value });
    const btn = (t, f) => { const b = el('button', {}, t); b.onclick = f; return b; };
    panel.append(el('div', { class: 'big' }, pg, el('div', {},
      el('div', { class: 'controls' }, shapeSel, colorSel, stateSel),
      el('div', { class: 'controls' }, btn('spin', () => pc.poke('spin')), btn('bounce', () => pc.poke('bounce')), btn('nod', () => pc.poke('nod')),
        btn('happy', () => pc.setExpression('happy')), btn('blink', () => pc.blink()), btn('neutral', () => pc.setExpression('neutral'))))));

    // 4. Stills: every shape x a few colours.
    panel.append(el('h2', {}, 'Stills: every shape (36 px, rest pose)'));
    const grid = el('div', { class: 'grid shapes' });
    grid.append(el('div'));
    STILL_COLORS.forEach((c) => grid.append(el('div', { class: 'cell label muted' }, c)));
    for (const shape of A.SHAPES) {
      grid.append(el('div', { class: 'label' }, shape));
      for (const color of STILL_COLORS) grid.append(el('div', { class: 'cell', html: A.svg({ shape, color, size: 36, theme }) }));
    }
    panel.append(grid);

    panel.append(el('h2', {}, 'All 11 colours (64 px)'));
    const colors = el('div', { class: 'row' });
    A.COLORS.forEach((c, i) => colors.append(el('div', { class: 'live' }, el('span', { html: A.svg({ shape: A.PICKER_SHAPES[i], color: c.id, size: 64, theme }) }), el('div', { class: 'label muted' }, c.id))));
    panel.append(colors);

    panel.append(el('h2', {}, 'Sizes: 16, 22, 28, 36, 72, 96 px'));
    const sizes = el('div', { class: 'row', style: 'align-items:center' });
    [16, 22, 28, 36, 72, 96].forEach((s) => sizes.append(el('span', { html: A.svg({ shape: 'heart', color: 'magenta', size: s, theme }) })));
    panel.append(sizes);

    panel.append(el('h2', {}, 'Expressions (still, 48 px)'));
    const faces = el('div', { class: 'row' });
    ['neutral', 'happy', 'surprised', 'inspecting', 'sad', 'sleepy', 'squinted', 'calm', 'confused'].forEach((x) => {
      faces.append(el('div', { class: 'live' }, el('span', { html: A.svg({ shape: 'blob', color: 'blue', size: 48, theme, expression: x }) }), el('div', { class: 'label muted' }, x)));
    });
    panel.append(faces);

    // 5. Groups.
    panel.append(el('h2', {}, 'Group avatars (64, 36, 20 px)'));
    const groups = el('div', { class: 'row', style: 'align-items:center' });
    const sets = [
      [{ initial: 'S' }, { shape: 'heart', color: 'magenta' }],
      [{ initial: 'S' }, { shape: 'cloud', color: 'green' }, { shape: 'star', color: 'yellow' }],
      [{ initial: 'S' }, { shape: 'heart', color: 'magenta' }, { shape: 'pebble', color: 'orange' }, { shape: 'sparkle', color: 'blue' }],
    ];
    for (const size of [64, 36, 20]) for (const m of sets) groups.append(el('span', { html: A.group(m, size, { theme }) }));
    panel.append(groups);

    // 6. Badges.
    panel.append(el('h2', {}, 'Badges'));
    const badges = el('div', { class: 'row', style: 'align-items:center' });
    ['main', 'unread', 'working', 'attention', 'error', 'offline', 'ring'].forEach((k) => {
      badges.append(el('div', { class: 'live' }, el('span', { html: A.badge(k, { theme, avatarSize: 60 }) }), el('div', { class: 'label muted' }, k)));
    });
    badges.append(el('div', { class: 'live' }, el('span', { html: A.svg({ shape: 'blob', color: 'magenta', size: 36, theme, badge: 'main' }) }), el('div', { class: 'label muted' }, 'still 36')));
    badges.append(el('div', { class: 'live' }, el('span', { html: A.svg({ shape: 'blob', color: 'magenta', size: 60, theme, badge: 'main' }) }), el('div', { class: 'label muted' }, 'still 60')));
    badges.append(el('div', { class: 'live' }, el('span', { html: A.svg({ shape: 'cloud', color: 'green', size: 36, theme, badge: 'unread' }) }), el('div', { class: 'label muted' }, 'unread')));
    panel.append(badges);

    // 7. Default looks from bot ids.
    panel.append(el('h2', {}, 'defaults(botId)'));
    const defs = el('div', { class: 'row' });
    ['test-agent-1', 'helper-bot', 'abc', 'research', 'planner', 'bot-42'].forEach((id) => {
      const d = A.defaults(id);
      defs.append(el('div', { class: 'live', style: 'width:92px' }, el('span', { html: A.svg({ ...d, size: 36, theme }) }), el('div', { class: 'label mono muted' }, `${id}\n${d.shape}/${d.color}`)));
    });
    panel.append(defs);
  }

  document.querySelectorAll('.panel').forEach(build);

  // Cycle the 64 px row through the main states every 3.5 s.
  let tick = 0;
  setInterval(() => {
    tick++;
    for (const c of controllers) {
      if (!c._cycle) continue;
      const s = CYCLE[(tick + c._cycleOffset) % CYCLE.length];
      c.set({ state: s });
      c._label.textContent = s;
    }
  }, 3500);
  window.__controllers = controllers;
})();
</script>
</body>
</html>
