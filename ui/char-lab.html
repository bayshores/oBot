<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openbot characters (test)</title>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 var(--font); background: #0a0a0b; color: #eee; }
  header { padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; border-bottom: 1px solid #222; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header p { margin: 0; color: #999; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 24px; border-bottom: 1px solid #222; }
  .controls button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid #333; background: #1b1b1d; color: #ddd; cursor: pointer; }
  .controls button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .panes { grid-template-columns: 1fr; } }
  .pane { padding: 20px 24px 30px; }
  .pane.dark { background: #121212; color: #ededed; }
  .pane.light { background: #f6f5f3; color: #1a1a1a; }
  .pane h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; opacity: .7; }
  .pane h3 { font-size: 12px; font-weight: 600; margin: 22px 0 10px; opacity: .55; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 6px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell span { font-size: 11px; opacity: .6; }
  .rows { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; max-width: 320px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; }
  .pane.dark .row:hover { background: #1f1f1f; }
  .pane.light .row:hover { background: #ebe9e5; }
  .row b { font-weight: 500; display: block; }
  .row small { opacity: .6; }
  svg.ob { overflow: visible; cursor: pointer; display: block; }
</style>
</head>
<body>
<header>
  <h1>openbot characters, test</h1>
  <p>One round bot, lots of skins. Hover to make them look at you, click one to poke it.</p>
</header>
<div class="controls" id="controls"></div>
<div class="panes">
  <section class="pane dark"><h2>Dark</h2><h3>Patterns</h3><div class="grid" id="p-dark"></div><h3>Colors</h3><div class="grid" id="c-dark"></div><div class="rows" id="r-dark"></div></section>
  <section class="pane light"><h2>Light</h2><h3>Patterns</h3><div class="grid" id="p-light"></div><h3>Colors</h3><div class="grid" id="c-light"></div><div class="rows" id="r-light"></div></section>
</div>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const CX = 50, CY = 50, R = 42; // the ball, in a 100x100 box
  const TAU = Math.PI * 2;

  // seeded random, so every copy of a skin looks the same
  const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  // ------------------------------------------------------------ skins
  const SOLIDS = {
    violet: '#8b5cf6', coral: '#ff6b57', amber: '#f5a524', lime: '#8fd14f', mint: '#2ec4a6', sky: '#38bdf8',
    cobalt: '#4f6bff', rose: '#f05c9c', slate: '#8a94a6', ink: '#2b2b33', sand: '#d9c3a0', snow: '#f2f0ec',
  };
  // Wavy band (a stripe) as a filled path: centre line x0 + wave, half-width w(y).
  function band(x0, amp, freq, phase, w0, taper, tilt) {
    const L = [], Rt = [];
    for (let y = -4; y <= 104; y += 4) {
      const t = (y + 4) / 108;
      const w = w0 * (taper ? Math.sin(Math.PI * Math.min(1, Math.max(0, t))) ** 0.6 : 1);
      const x = x0 + Math.sin(y * freq + phase) * amp + (y - 50) * tilt;
      L.push(`${(x - w).toFixed(2)},${y}`); Rt.unshift(`${(x + w).toFixed(2)},${y}`);
    }
    return `M${L.join('L')}L${Rt.join('L')}Z`;
  }
  function blob(rand, cx, cy, r) {
    const n = 7, pts = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * TAU, k = r * (0.7 + rand() * 0.5); pts.push([cx + Math.cos(a) * k, cy + Math.sin(a) * k]); }
    let d = '';
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      if (!i) d += `M${p1[0].toFixed(2)},${p1[1].toFixed(2)}`;
      d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(2)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(2)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(2)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
    }
    return d + 'Z';
  }
  // Each pattern draws inside group g (already clipped to the ball). Returns {eyes, ring} styling.
  const PATTERNS = {
    zebra(g, defs, id) {
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#f6f4ef' }, g);
      const r = rng(11);
      for (let i = -1; i < 9; i++) el('path', { d: band(i * 13 + 2, 3 + r() * 3, 0.07 + r() * 0.03, r() * 6, 2.6 + r() * 2.4, true, 0.18), fill: '#16161a' }, g);
      return { eye: '#16161a', ring: '#f6f4ef' };
    },
    tiger(g) {
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#f28a2e' }, g);
      const r = rng(5);
      for (let i = 0; i < 6; i++) {
        const y = 14 + i * 14 + r() * 4;
        el('path', { d: `M-2,${y} Q16,${y - 4} ${24 + r() * 10},${y + 2} Q12,${y + 5} -2,${y + 6}Z`, fill: '#1e1410' }, g);
        el('path', { d: `M102,${y + 6} Q84,${y + 2} ${76 - r() * 10},${y + 7} Q88,${y + 11} 102,${y + 12}Z`, fill: '#1e1410' }, g);
      }
      el('ellipse', { cx: 50, cy: 78, rx: 26, ry: 14, fill: '#fbe7cf' }, g);
      return { eye: '#1e1410' };
    },
    cow(g) {
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#f7f5f0' }, g);
      const r = rng(23);
      for (const [x, y, s] of [[16, 22, 14], [74, 18, 12], [86, 66, 15], [30, 80, 13], [56, 40, 7]]) el('path', { d: blob(r, x, y, s), fill: '#1b1b1f' }, g);
      return { eye: '#1b1b1f', ring: '#f7f5f0' };
    },
    dots(g) {
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#ff5d7d' }, g);
      for (let y = 6, row = 0; y < 100; y += 14, row++) for (let x = row % 2 ? 13 : 6; x < 100; x += 14) el('circle', { cx: x, cy: y, r: 3.4, fill: '#fff', opacity: .9 }, g);
      return { eye: '#1b1420', ring: '#ff5d7d' };
    },
    checker(g) {
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#ece8ff' }, g);
      for (let y = 0; y < 100; y += 12.5) for (let x = 0; x < 100; x += 12.5) if (((x + y) / 12.5) % 2 === 0) el('rect', { x, y, width: 12.5, height: 12.5, fill: '#7c5cf0', opacity: .55 }, g);
      return { eye: '#1d1530', ring: '#ece8ff' };
    },
    sunset(g, defs, id) {
      const lg = el('linearGradient', { id: id + 'ss', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      [['0', '#ffd36e'], ['.45', '#ff7a6b'], ['1', '#8e5cf7']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, lg));
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: `url(#${id}ss)` }, g);
      return { eye: '#22142a' };
    },
    ocean(g, defs, id) {
      const lg = el('linearGradient', { id: id + 'oc', x1: 0, y1: 0, x2: 0.3, y2: 1 }, defs);
      [['0', '#7ef0ff'], ['.5', '#3aa0ff'], ['1', '#2a48d8']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, lg));
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: `url(#${id}oc)` }, g);
      for (let i = 0; i < 3; i++) el('path', { d: `M-5,${62 + i * 11} Q12,${57 + i * 11} 25,${62 + i * 11} T55,${62 + i * 11} T85,${62 + i * 11} T115,${62 + i * 11}`, fill: 'none', stroke: '#fff', 'stroke-opacity': .25 - i * .06, 'stroke-width': 2.4 }, g);
      return { eye: '#0d1b3a' };
    },
    aurora(g, defs, id) {
      const lg = el('linearGradient', { id: id + 'au', x1: 0, y1: 1, x2: 1, y2: 0 }, defs);
      [['0', '#2dd4bf'], ['.5', '#38bdf8'], ['1', '#c084fc']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, lg));
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: `url(#${id}au)` }, g);
      return { eye: '#10202a' };
    },
    holo(g, defs, id) {
      const lg = el('linearGradient', { id: id + 'ho', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
      [['0', '#ffd1f2'], ['.25', '#c7d2ff'], ['.5', '#b8fff0'], ['.75', '#fff3b0'], ['1', '#ffc4d6']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, lg));
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: `url(#${id}ho)` }, g);
      el('path', { d: 'M10,-5 L32,-5 L-5,40 L-5,18Z', fill: '#fff', opacity: .55 }, g);
      el('path', { d: 'M40,-5 L48,-5 L-5,62 L-5,52Z', fill: '#fff', opacity: .4 }, g);
      return { eye: '#2a2340' };
    },
    galaxy(g, defs, id) {
      const rg = el('radialGradient', { id: id + 'ga', cx: '35%', cy: '30%', r: '80%' }, defs);
      [['0', '#4c3bb8'], ['.6', '#1b1648'], ['1', '#0b0a1e']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, rg));
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: `url(#${id}ga)` }, g);
      el('ellipse', { cx: 68, cy: 70, rx: 26, ry: 12, fill: '#ff6ec7', opacity: .22, transform: 'rotate(-25 68 70)' }, g);
      const r = rng(7);
      for (let i = 0; i < 26; i++) el('circle', { cx: r() * 100, cy: r() * 100, r: 0.4 + r() * 0.9, fill: '#fff', opacity: 0.4 + r() * 0.6 }, g);
      return { eye: '#f4f1ff' };
    },
    marble(g) {
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#f3f0ea' }, g);
      const r = rng(31);
      for (let i = 0; i < 5; i++) {
        const y = 10 + i * 20 + r() * 8;
        el('path', { d: `M-5,${y} C20,${y - 14 + r() * 8} 40,${y + 16} 60,${y + 2} S95,${y - 10} 108,${y + 4}`, fill: 'none', stroke: '#9b958c', 'stroke-width': 0.6 + r() * 1.4, opacity: .55 }, g);
      }
      el('path', { d: 'M20,-5 C30,30 58,40 70,105', fill: 'none', stroke: '#c9a76a', 'stroke-width': 1.2, opacity: .7 }, g);
      return { eye: '#26231f' };
    },
    camo(g) {
      el('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#7a8a52' }, g);
      const r = rng(41);
      const cols = ['#4f5b33', '#a9a06a', '#3a3324', '#5f6e3c'];
      for (let i = 0; i < 16; i++) el('path', { d: blob(r, r() * 100, r() * 100, 8 + r() * 9), fill: cols[i % 4] }, g);
      return { eye: '#17150f', ring: '#c9c38f' };
    },
  };

  // ------------------------------------------------------------ one character
  let uid = 0;
  const all = [];

  function create(host, { skin, size, dark }) {
    const id = 'ob' + uid++;
    const svg = el('svg', { viewBox: '0 0 100 100', width: size, height: size, class: 'ob', role: 'img', 'aria-label': 'bot' }, host);
    const defs = el('defs', {}, svg);
    const clip = el('clipPath', { id: id + 'k' }, defs); el('circle', { cx: CX, cy: CY, r: R }, clip);
    const shade = el('radialGradient', { id: id + 'h', cx: '32%', cy: '24%', r: '78%' }, defs);
    el('stop', { offset: '0', 'stop-color': '#fff', 'stop-opacity': .16 }, shade);
    el('stop', { offset: '.6', 'stop-color': '#fff', 'stop-opacity': 0 }, shade);
    const lowlight = el('radialGradient', { id: id + 'l', cx: '50%', cy: '42%', r: '62%' }, defs);
    el('stop', { offset: '.72', 'stop-color': '#000', 'stop-opacity': 0 }, lowlight);
    el('stop', { offset: '1', 'stop-color': '#000', 'stop-opacity': .16 }, lowlight);

    const shadow = el('ellipse', { cx: 50, cy: 97, rx: 30, ry: 3.4, fill: '#000', opacity: dark ? .5 : .14 }, svg);
    const mover = el('g', {}, svg);
    const body = el('g', {}, mover);
    const skinG = el('g', { 'clip-path': `url(#${id}k)` }, body);
    let style = { eye: '#17131f' };
    if (PATTERNS[skin]) style = PATTERNS[skin](skinG, defs, id) || style;
    else { el('rect', { x: 0, y: 0, width: 100, height: 100, fill: SOLIDS[skin] }, skinG); if (skin === 'ink') style = { eye: '#f1eff7' }; }
    el('circle', { cx: CX, cy: CY, r: R, fill: `url(#${id}h)` }, body);
    el('circle', { cx: CX, cy: CY, r: R, fill: `url(#${id}l)` }, body);
    el('circle', { cx: CX, cy: CY, r: R - 0.6, fill: 'none', stroke: '#fff', 'stroke-opacity': dark ? .10 : .22, 'stroke-width': 1.2 }, body);
    // light theme: a hairline edge so pale skins don't melt into the page
    if (!dark) el('circle', { cx: CX, cy: CY, r: R + 0.3, fill: 'none', stroke: '#000', 'stroke-opacity': .09, 'stroke-width': 0.8 }, body);
    const face = el('g', {}, body);
    const eyes = [0, 1].map(() => el('path', { fill: style.eye, stroke: style.eye, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, face));
    // patterned skins get a soft ring so the eyes always read
    if (style.ring) for (const e of eyes) { e.dataset.ring = style.ring; }
    const rings = style.ring ? [0, 1].map(() => el('path', { fill: 'none', stroke: style.ring, 'stroke-width': 3.2, opacity: .9 }, face)) : null;
    if (rings) for (const r of rings) face.insertBefore(r, face.firstChild);
    const zz = el('text', { x: 80, y: 16, 'font-size': 12, 'font-weight': 700, fill: dark ? '#cfcfd6' : '#555', opacity: 0, 'font-family': 'var(--font)' }, svg);
    zz.textContent = 'z';
    const c = { svg, mover, body, shadow, eyes, rings, zz, dark, state: 'idle', move: null, prev: NEUTRAL(), gaze: [0, 0], pointer: null, blinkAt: performance.now() + 600 + Math.random() * 2500, blinkT: -1, poke: -1, seed: Math.random() * 100, last: null };
    svg.addEventListener('click', () => { c.poke = performance.now(); });
    all.push(c);
    return c;
  }

  // ------------------------------------------------------------ motion
  // A pose: where the ball is and what the eyes are doing. Every move is a function of p (0..1).
  const NEUTRAL = () => ({ x: 0, y: 0, rot: 0, sx: 1, sy: 1, lx: 0, ly: 0, open: 1, eye: 'open', lean: 0 });
  const ease = { out: (t) => 1 - (1 - t) ** 3, inOut: (t) => (t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2), back: (t) => { const c = 1.7; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; } };
  const bell = (p) => Math.sin(Math.PI * Math.min(1, Math.max(0, p)));
  // a jump with anticipation, stretch in the air and a squash on landing
  function jump(P, p, height, a = 0.18, land = 0.82) {
    if (p < a) { const q = ease.out(p / a); P.sx += 0.14 * q; P.sy -= 0.14 * q; }
    else if (p < land) { const q = (p - a) / (land - a); P.y -= height * Math.sin(Math.PI * q); const st = Math.cos(Math.PI * q); P.sx -= 0.08 * Math.abs(st) - 0.0; P.sy += 0.1 * Math.abs(st); }
    else { const q = (p - land) / (1 - land); const s = Math.sin(Math.PI * q) * 0.13; P.sx += s; P.sy -= s; }
  }
  const MOVES = {
    // working
    type: { d: 1.4, f(P, p) { const b = Math.abs(Math.sin(p * Math.PI * 7)); P.y -= b * 2.4; P.sy += (b - .5) * .05; P.sx -= (b - .5) * .05; P.ly = .7; P.lx = Math.sin(p * Math.PI * 2) * .35; P.open = .6; } },
    scan: { d: 1.6, f(P, p) { const s = Math.sin(p * TAU); P.lx = s; P.ly = -.1; P.rot = s * 7; P.x = s * 2.5; P.open = .75; } },
    roll: { d: 1.5, f(P, p, dir) { const x = dir * 16 * bell(p); P.x = x; P.rot = (x / R) * 57.3; P.ly = .1; P.lx = dir * .4 * bell(p * 2); P.sy -= .03 * bell(p); } },
    hop: { d: .9, f(P, p) { jump(P, p, 13); P.ly = -.3; } },
    flip: { d: 1.15, f(P, p, dir) { jump(P, p, 18); const q = Math.min(1, Math.max(0, (p - .2) / .62)); P.rot = dir * 360 * ease.inOut(q); P.eye = p > .2 && p < .82 ? 'squint' : 'open'; } },
    pump: { d: 1.0, f(P, p) { const w = Math.sin(p * TAU * 2) * (1 - p * .4); P.sx += w * .12; P.sy -= w * .12; P.eye = 'squint'; P.ly = .2; } },
    peek: { d: 1.5, f(P, p, dir) { const b = ease.inOut(bell(p)); P.x = dir * 10 * b; P.rot = dir * 16 * b; P.lx = dir * b; P.ly = -.2 * b; P.eye = b > .5 ? 'wide' : 'open'; } },
    shake: { d: .9, f(P, p) { P.rot = Math.sin(p * Math.PI * 9) * 10 * (1 - p); P.x = Math.sin(p * Math.PI * 9) * 2 * (1 - p); P.eye = 'squint'; } },
    jelly: { d: 1.1, f(P, p) { const w = Math.sin(p * Math.PI * 6) * (1 - p); P.sx += w * .1; P.sy -= w * .1; P.rot = w * 4; P.ly = .3; } },
    stomp: { d: 1.2, f(P, p) { const k = Math.floor(p * 3), q = (p * 3) % 1; P.y -= Math.sin(Math.PI * q) * 4; P.rot = (k % 2 ? 1 : -1) * 6 * Math.sin(Math.PI * q); P.ly = .4; P.open = .7; } },
    // thinking
    ponder: { d: 2.4, f(P, p) { const s = Math.sin(p * TAU); P.lx = .6 + s * .25; P.ly = -.75; P.rot = 6 + s * 4; P.open = .8; P.y -= bell(p) * 2; } },
    hmm: { d: 2.0, f(P, p) { const b = ease.inOut(bell(p)); P.rot = -12 * b; P.lx = -.55 * b; P.ly = -.6 * b; P.eye = b > .4 ? 'squint' : 'open'; } },
    float: { d: 2.6, f(P, p) { P.y -= Math.sin(p * TAU) * 3 + 2; P.lx = Math.sin(p * TAU) * .5; P.ly = -.5; P.sx += Math.sin(p * TAU) * .02; } },
    // waiting
    bounce: { d: 1.2, f(P, p) { jump(P, (p * 2) % 1, 6, .2, .85); P.eye = 'wide'; } },
    leanin: { d: 1.8, f(P, p) { const b = ease.inOut(bell(p)); P.sx += .08 * b; P.sy += .08 * b; P.y += 2 * b; P.eye = 'wide'; } },
    tap: { d: 1.4, f(P, p) { const q = (p * 4) % 1; P.y -= Math.max(0, Math.sin(Math.PI * q)) * 2.2; P.rot = 3; P.lx = .2; } },
    // done
    cheer: { d: 1.5, f(P, p) { jump(P, p, 20, .16, .84); const q = Math.min(1, Math.max(0, (p - .16) / .68)); P.rot = 360 * ease.inOut(q); P.eye = 'happy'; } },
    wiggle: { d: 1.3, f(P, p) { P.rot = Math.sin(p * Math.PI * 6) * 12 * bell(p); P.y -= bell(p) * 4; P.eye = 'happy'; } },
    hooray: { d: 1.2, f(P, p) { jump(P, (p * 2) % 1, 9); P.eye = 'happy'; } },
    // idle
    rest: { d: 2.6, f(P) {} },
    glance: { d: 2.2, f(P, p, dir) { const b = ease.inOut(bell(p)); P.lx = dir * .9 * b; P.ly = -.1 * b; P.rot = dir * 3 * b; } },
    curious: { d: 1.8, f(P, p, dir) { const b = ease.back(Math.min(1, p * 2)) * (p < .7 ? 1 : 1 - ease.inOut((p - .7) / .3)); P.rot = dir * 14 * b; P.eye = b > .5 ? 'wide' : 'open'; } },
    microhop: { d: .8, f(P, p) { jump(P, p, 5); } },
    // sleeping
    snooze: { d: 3.2, f(P, p) { const s = Math.sin(p * TAU); P.sx += .03 + s * .02; P.sy -= .03 + s * .02; P.eye = 'closed'; P.rot = 4; } },
  };
  const PLAYLIST = {
    idle: [['rest', 4], ['glance', 2], ['curious', 1], ['microhop', 1]],
    working: [['type', 3], ['scan', 2], ['roll', 2], ['hop', 2], ['flip', 1], ['pump', 1], ['peek', 2], ['shake', 1], ['jelly', 1], ['stomp', 1]],
    thinking: [['ponder', 3], ['hmm', 2], ['float', 2]],
    waiting: [['bounce', 2], ['leanin', 2], ['tap', 2]],
    done: [['cheer', 2], ['wiggle', 2], ['hooray', 2]],
    sleeping: [['snooze', 1]],
  };
  function pick(c) {
    const list = PLAYLIST[c.state];
    let total = 0; for (const [, w] of list) total += w;
    let name;
    for (let tries = 0; tries < 4; tries++) {
      let r = Math.random() * total;
      for (const [n, w] of list) { r -= w; if (r <= 0) { name = n; break; } }
      if (name !== c.last || list.length === 1) break;
    }
    c.last = name;
    return { name, start: performance.now(), d: MOVES[name].d * (0.9 + Math.random() * 0.25) * 1000, dir: Math.random() < .5 ? -1 : 1 };
  }

  function blend(a, b, w) {
    const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' ? a[k] + (b[k] - a[k]) * w : (w < .5 ? a[k] : b[k]);
    return o;
  }

  function drawEye(e, ring, x, y, w, h, mode, open) {
    let d, filled = true;
    if (mode === 'happy') { d = `M${x - w},${y + 2} Q${x},${y - h * 1.15} ${x + w},${y + 2}`; filled = false; }
    else if (mode === 'closed' || open < 0.16) { d = `M${x - w},${y + 1} Q${x},${y + 3.2} ${x + w},${y + 1}`; filled = false; }
    else {
      const hh = Math.max(w * 1.02, h * open), r = w;
      d = `M${x - w},${y - hh + r} A${r},${r} 0 0 1 ${x + w},${y - hh + r} L${x + w},${y + hh - r} A${r},${r} 0 0 1 ${x - w},${y + hh - r}Z`;
    }
    e.setAttribute('d', d);
    e.setAttribute('fill', filled ? e.getAttribute('stroke') : 'none');
    e.setAttribute('stroke-width', filled ? 0 : 3.4);
    if (ring) { ring.setAttribute('d', d); ring.setAttribute('stroke-width', filled ? 3.2 : 6.4); }
  }

  function frame(now) {
    for (const c of all) {
      if (!c.move || now - c.move.start >= c.move.d) { if (c.move) c.prev = c.pose || NEUTRAL(); c.move = pick(c); }
      const m = c.move, p = Math.min(1, (now - m.start) / m.d);
      let P = NEUTRAL();
      MOVES[m.name].f(P, p, m.dir);
      // breathing under everything
      const br = Math.sin(now / 1000 * 2.2 + c.seed) * 0.012; P.sx -= br; P.sy += br;
      // poke: squash, pop up, happy face
      if (c.poke > 0) {
        const q = (now - c.poke) / 750;
        if (q >= 1) c.poke = -1; else { const Q = NEUTRAL(); jump(Q, q, 12, .2, .8); Q.eye = q > .2 ? 'happy' : 'squint'; Q.rot = Math.sin(q * Math.PI * 4) * 8 * (1 - q); P = blend(P, Q, Math.min(1, q * 6) * (q > .85 ? (1 - q) / .15 : 1)); }
      }
      // ease in from the end of the previous move so nothing pops
      const w = Math.min(1, (now - m.start) / 220);
      if (w < 1) P = blend(c.prev, P, ease.out(w));
      c.pose = P;
      // look at the pointer when calm
      let lx = P.lx, ly = P.ly;
      if (c.pointer && (c.state === 'idle' || c.state === 'waiting') && P.eye !== 'happy') { lx = lx * .3 + c.pointer[0] * .9; ly = ly * .3 + c.pointer[1] * .9; }
      c.gaze[0] += (lx - c.gaze[0]) * .14; c.gaze[1] += (ly - c.gaze[1]) * .14;
      // blink
      let open = P.open;
      if (P.eye === 'squint') open *= .55;
      if (P.eye !== 'closed' && P.eye !== 'happy' && now > c.blinkAt) { c.blinkT = now; c.blinkAt = now + 2000 + Math.random() * 3500 + (Math.random() < .2 ? -1700 : 0); }
      const bp = (now - c.blinkT) / 150; if (bp >= 0 && bp < 1) open *= Math.abs(1 - 2 * bp) ** 1.3;

      c.mover.setAttribute('transform', `translate(${P.x.toFixed(2)} ${P.y.toFixed(2)})`);
      c.body.setAttribute('transform', `translate(50 92) scale(${P.sx.toFixed(3)} ${P.sy.toFixed(3)}) translate(-50 -92) rotate(${P.rot.toFixed(2)} 50 50)`);
      const lift = Math.max(0, -P.y); const k = 1 - Math.min(.5, lift / 40);
      c.shadow.setAttribute('cx', (50 + P.x).toFixed(2)); c.shadow.setAttribute('rx', (30 * k * (P.sx)).toFixed(2));
      c.shadow.setAttribute('opacity', ((c.dark ? .5 : .14) * k).toFixed(3));
      const wide = P.eye === 'wide' ? 1.12 : 1;
      const ex = 50 + c.gaze[0] * 9, ey = 48 + c.gaze[1] * 7;
      drawEye(c.eyes[0], c.rings && c.rings[0], ex - 12, ey, 5.2 * wide, 11 * wide, P.eye, open);
      drawEye(c.eyes[1], c.rings && c.rings[1], ex + 12, ey, 5.2 * wide, 11 * wide, P.eye, open);
      const zp = (now / 2000) % 1;
      c.zz.setAttribute('opacity', c.state === 'sleeping' ? (bell(zp) * .9).toFixed(3) : 0);
      c.zz.setAttribute('transform', `translate(${(zp * 6).toFixed(2)} ${(-zp * 10).toFixed(2)})`);
    }
    requestAnimationFrame(frame);
  }

  addEventListener('pointermove', (e) => {
    for (const c of all) {
      const r = c.svg.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width / 2)) / 240, dy = (e.clientY - (r.top + r.height / 2)) / 240;
      const m = Math.hypot(dx, dy), k = m > 1 ? 1 / m : 1;
      c.pointer = [dx * k, dy * k];
    }
  });
  document.addEventListener('pointerleave', () => { for (const c of all) c.pointer = null; });

  // ------------------------------------------------------------ page
  const PAT = Object.keys(PATTERNS), COL = Object.keys(SOLIDS);
  const ROWS = [['violet', 'General Bot', 'Main Bot · ready'], ['zebra', 'Research Desk', 'Found 3 new papers'], ['galaxy', 'Ops Runner', 'Weekly report sent'], ['sunset', 'Inbox Helper', 'Waiting for you']];
  for (const theme of ['dark', 'light']) {
    const dark = theme === 'dark';
    for (const [gridId, list, sz] of [['p-' + theme, PAT, 72], ['c-' + theme, COL, 56]]) {
      const grid = document.getElementById(gridId);
      for (const skin of list) {
        const cell = document.createElement('div'); cell.className = 'cell'; grid.appendChild(cell);
        create(cell, { skin, size: sz, dark });
        const lab = document.createElement('span'); lab.textContent = skin; cell.appendChild(lab);
      }
    }
    const rows = document.getElementById('r-' + theme);
    for (const [skin, name, sub] of ROWS) {
      const row = document.createElement('div'); row.className = 'row'; rows.appendChild(row);
      create(row, { skin, size: 36, dark });
      const tx = document.createElement('div'); tx.innerHTML = `<b>${name}</b><small>${sub}</small>`; row.appendChild(tx);
    }
  }
  const ctl = document.getElementById('controls');
  for (const s of Object.keys(PLAYLIST)) {
    const b = document.createElement('button'); b.textContent = s; if (s === 'idle') b.className = 'on';
    b.onclick = () => { for (const x of ctl.children) x.className = ''; b.className = 'on'; for (const c of all) { c.state = s; c.prev = c.pose || NEUTRAL(); c.move = pick(c); } };
    ctl.appendChild(b);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
