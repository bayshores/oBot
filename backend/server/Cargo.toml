[package]
name = "obot-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "obot-server"
path = "src/main.rs"

[dependencies]
obot-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
chrono = { version = "0.4", features = ["clock"] }
