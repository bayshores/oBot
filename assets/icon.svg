<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- openbot app icon: a purple ball bot peeking in from the top right. Render: rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png -->
  <defs>
    <clipPath id="t"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b2d"/><stop offset="1" stop-color="#151516"/></linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".3" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
    <radialGradient id="body" gradientUnits="userSpaceOnUse" cx="560" cy="380" r="560"><stop offset="0" stop-color="#b892ff"/><stop offset=".6" stop-color="#9467f5"/><stop offset="1" stop-color="#7448dc"/></radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="1000"><stop offset="0" stop-color="#e4d6ff" stop-opacity=".95"/><stop offset="1" stop-color="#e4d6ff" stop-opacity=".5"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <g clip-path="url(#t)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <!-- the bot: a big round ball hanging in from the top right, peeking down-left -->
    <circle cx="640" cy="400" r="430" fill="#000" opacity=".45" filter="url(#soft)" transform="translate(-6 18)"/>
    <circle cx="640" cy="400" r="430" fill="url(#body)"/>
    <circle cx="640" cy="400" r="426" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <g transform="rotate(30 560 470)">
      <rect x="426" y="362" width="106" height="214" rx="53" fill="#1a1a1b"/>
      <rect x="600" y="362" width="106" height="214" rx="53" fill="#1a1a1b"/>
      <rect x="426" y="362" width="106" height="214" rx="53" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="7" stroke-dasharray="0 360 220 700"/>
      <rect x="600" y="362" width="106" height="214" rx="53" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="7" stroke-dasharray="0 360 220 700"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#bevel)" stroke-width="5"/>
</svg>
